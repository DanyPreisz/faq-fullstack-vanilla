<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FAQ</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="shell">
    <header>
      <div><p class="eyebrow">Publico</p><h1>FAQ</h1></div>
      <div class="who"><strong id="user-name"></strong><button id="auth-toggle" class="ghost" type="button">Admin</button></div>
    </header>
    <section id="auth-view" class="auth card hidden">
      <div class="tabs">
        <button class="tab active" type="button" data-mode="login">Entrar</button>
        <button class="tab" type="button" data-mode="register">Crear cuenta</button>
      </div>
      <p>La primera cuenta es admin.</p>
      <form id="auth-form">
        <label>Usuario <input name="username" required minlength="3" maxlength="20" autocomplete="username" /></label>
        <label>Contrasena <input name="password" type="password" required minlength="6" autocomplete="current-password" /></label>
        <p id="auth-error" class="error" hidden></p>
        <button id="auth-submit" class="primary" type="submit">Entrar</button>
      </form>
    </section>
    <form id="faq-form" class="card form hidden">
      <input id="question" placeholder="Pregunta" maxlength="160" required />
      <textarea id="answer" placeholder="Respuesta" maxlength="2000" required></textarea>
      <button class="primary" type="submit">Publicar</button>
    </form>
    <p id="form-error" class="error" hidden></p>
    <input id="search" type="search" placeholder="Buscar pregunta" />
    <ul id="list"></ul>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
